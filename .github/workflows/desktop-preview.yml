name: Desktop preview packages
on:
  push:
    branches: [feature/desktop-overview]
    paths: ['dev/desktop/native-build-request.json']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Native platforms to build'
        type: choice
        options: [macos, all, windows]
        default: macos
      preset_archive_url:
        description: 'URL of exported desktop-presets.zip or existing desktop Windows ZIP (six looks + notices)'
        required: true
        type: string

permissions:
  # GitHub requires write-capable repository access to read draft release assets.
  # This workflow never publishes or changes a release.
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["windows-latest","macos-15","macos-15-intel"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      A7C2_PRESET_ARCHIVE_URL: ${{ inputs.preset_archive_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop-requirements.txt
      - name: macOS native compiler dependencies
        if: runner.os == 'macOS'
        run: python -m pip install cmake==3.31.6 setuptools==80.9.0 setuptools-scm==8.3.1 wheel==0.45.1 backports.tarfile==1.2.0
      - name: Dependencies
        # Keystone and Unicorn lack ARM64 Mac wheels at these versions;
        # compile them natively, instead of bundling Intel libraries into ARM64.
        run: python -m pip install --no-build-isolation -r desktop-requirements.txt pyinstaller==6.16.0 pytest==8.3.5
      - name: Native dependency load check
        run: python -c "import platform, keystone, unicorn; k=keystone.Ks(keystone.KS_ARCH_ARM64, keystone.KS_MODE_LITTLE_ENDIAN); print(platform.machine(), k.asm('mov x0, 1'), unicorn.Uc(unicorn.UC_ARCH_ARM64, unicorn.UC_MODE_ARM))"
      - name: Prepare build assets
        run: python dev/desktop/prepare_assets.py
      - name: Focused desktop contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest dev/desktop/test_packaging.py dev/desktop/test_macos_host.py dev/desktop/test_reloadguide.py dev/desktop/test_recovery_completion_ui.py dev/desktop/test_exiftool.py dev/desktop/test_allinone.py -q
      - name: Build native package
        run: python dev/desktop/build.py
      - name: Windows packaged offline checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/A7C2Tools/A7C2Tools.exe).Path
          $result = Join-Path (Resolve-Path dist).Path 'packaged-self-test.json'
          $p = Start-Process -FilePath $app -ArgumentList @('--offline-self-test', $result) -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Packaged offline self-test failed' }
          Get-Content $result
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:A7C2_DESKTOP_DATA = Join-Path (Resolve-Path dist).Path 'ui-smoke'
          $p = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Packaged GUI smoke test failed' }
      - name: macOS packaged offline checks
        if: runner.os == 'macOS'
        run: |
          dist/A7C2Tools.app/Contents/MacOS/A7C2Tools --offline-self-test "$PWD/dist/packaged-self-test.json"
          QT_QPA_PLATFORM=offscreen A7C2_DESKTOP_DATA="$PWD/dist/ui-smoke" dist/A7C2Tools.app/Contents/MacOS/A7C2Tools --smoke-test
          codesign --verify --deep --strict dist/A7C2Tools.app
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A7C2Tools-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*self-test.json
            dist/ui-smoke/**/*.png
            ~/Library/Logs/A7C2Tools/startup-error.log
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
